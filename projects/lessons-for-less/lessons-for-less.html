<body>
  <div class="page-layout">
    <site-sidebar root="../.."></site-sidebar>
    <main class="main-content">
      <section id="intro-heading">
        <h1>Lessons for Less</h1>
        <hr>
        <p>A collection of quick drawings from ~2009-2011.</p>
        <br>
        <div id="gallery"></div>
      </section>
    </main>
  </div>

  <script>
    (function () {
      const images = [
        { src: '9.jpg',                                    alt: 'Lessons for Less',                                  full: true },
        { src: 'PortfolioDrawings2.jpg',                   alt: 'Lessons for Less — portfolio drawings',             full: true },
        { src: 'TheCirclesOfLife.jpg',                     alt: 'Lessons for Less — the circles of life',            full: true },
        { src: 'TheManWithTheTwistyMoustache.jpg',         alt: 'Lessons for Less — the man with the twisty moustache', full: true },
        { src: 'armsrace.jpg',                             alt: 'Lessons for Less — arms race' },
        { src: 'boredtree%20-%20ipod.jpg',                 alt: 'Lessons for Less — bored tree ipod' },
        { src: 'catnip.jpg',                               alt: 'Lessons for Less — catnip' },
        { src: 'cheese.jpg',                               alt: 'Lessons for Less — cheese' },
        { src: 'courtney.jpg',                             alt: 'Lessons for Less — courtney' },
        { src: 'fly.jpg',                                  alt: 'Lessons for Less — fly' },
        { src: 'ghost.jpg',                                alt: 'Lessons for Less — ghost' },
        { src: 'norman.jpg',                               alt: 'Lessons for Less — norman' },
        { src: 'octopus.jpg',                              alt: 'Lessons for Less — octopus' },
        { src: 'peas.jpg',                                 alt: 'Lessons for Less — peas' },
        { src: 'prost.jpg',                                alt: 'Lessons for Less — prost' },
        { src: 'rockgroup.jpg',                            alt: 'Lessons for Less — rock group' },
        { src: 'shitty_football_01.png',                   alt: 'Lessons for Less — shitty football 1',              full: true },
        { src: 'shitty_football_02.png',                   alt: 'Lessons for Less — shitty football 2',              full: true },
        { src: 'shitty_football_03.png',                   alt: 'Lessons for Less — shitty football 3',              full: true },
        { src: 'shitty_football_04.png',                   alt: 'Lessons for Less — shitty football 4',              full: true },
        { src: 'society6_baffled.jpg',                     alt: 'Lessons for Less — baffled' },
        { src: 'society6_mobile_cards_morange.jpg',        alt: 'Lessons for Less — mobile cards' },
        { src: 'society6_synth.jpg',                       alt: 'Lessons for Less — synth' },
        { src: 'society6_yoghurt.jpg',                     alt: 'Lessons for Less — yoghurt' },
        { src: 'summer.jpg',                               alt: 'Lessons for Less — summer' },
        { src: 'trackpad.jpg',                             alt: 'Lessons for Less — trackpad' },
        { src: 'walrus.jpg',                               alt: 'Lessons for Less — walrus' },
      ];

      const gallery = document.getElementById('gallery');
      let i = 0;

      while (i < images.length) {
        if (images[i].full) {
          const img = document.createElement('img');
          img.src = images[i].src;
          img.alt = images[i].alt;
          gallery.appendChild(img);
          i++;
        } else {
          const next = i + 1 < images.length && !images[i + 1].full;
          if (next) {
            const row = document.createElement('div');
            row.style.cssText = 'display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px';
            for (let j = 0; j < 2; j++) {
              const img = document.createElement('img');
              img.src = images[i + j].src;
              img.alt = images[i + j].alt;
              img.style.marginBottom = '0';
              img.style.height = 'auto';
              row.appendChild(img);
            }
            gallery.appendChild(row);
            i += 2;
          } else {
            const img = document.createElement('img');
            img.src = images[i].src;
            img.alt = images[i].alt;
            gallery.appendChild(img);
            i++;
          }
        }
      }
    })();
  </script>

</body>
